<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Multiplication Table | HW3</title>
		<!-- Bootstrap CSS -->
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<!-- Custom CSS -->
		<link rel="stylesheet" href="/css/style.css" />
	</head>
	<body class="bg-dark">
		<div class="container py-4">
			<!-- Header -->
			<div class="text-center mb-4">
				<h1 class="main-text-color">Multiplication Table Generator</h1>
				<p class="text-secondary">Enter ranges to create your table</p>
			</div>

			<!-- Form Card -->
			<div class="card bg-secondary bg-opacity-25 mb-4">
				<div class="card-body">
					<form id="tableForm">
						<!-- Horizontal Section -->
						<div class="mb-4">
							<label class="form-label text-light fw-bold">
								Horizontal Axis (Row)
							</label>
							<div class="mb-2">
								<div class="input-group">
									<span
										class="input-group-text main-button-text-background text-white"
									>
										Min Number
									</span>
									<input
										type="number"
										id="startX"
										class="form-control bg-dark text-light"
										value="1"
										step="1"
									/>
								</div>
							</div>
							<div>
								<div class="input-group">
									<span class="input-group-text bg-secondary text-white">
										Max Number
									</span>
									<input
										type="number"
										id="endX"
										class="form-control bg-dark text-light"
										value="5"
										step="1"
									/>
								</div>
							</div>
							<div class="form-text text-secondary mt-2">
								Please enter numbers from -50 to 50
							</div>
						</div>

						<!-- Vertical Axis Section -->
						<div class="mb-4">
							<label class="form-label text-light fw-bold">
								Vertical Axis (Column)
							</label>
							<div class="mb-2">
								<div class="input-group">
									<span
										class="input-group-text main-button-text-background text-white"
									>
										Min Number
									</span>
									<input
										type="number"
										id="startY"
										class="form-control bg-dark text-light"
										value="1"
										step="1"
									/>
								</div>
							</div>
							<div>
								<div class="input-group">
									<span class="input-group-text bg-secondary text-white">
										Max Number
									</span>
									<input
										type="number"
										id="endY"
										class="form-control bg-dark text-light"
										value="5"
										step="1"
									/>
								</div>
							</div>
							<div class="form-text text-secondary mt-2">
								Please enter numbers from -50 to 50
							</div>
						</div>

						<!-- Buttons Row -->
						<div class="text-center mt-4">
							<button type="submit" class="btn main-button-text-background generate-button px-4 text-white">
								Generate Table
							</button>
							<button
								type="button"
								id="resetBtn"
								class="btn btn-secondary px-4 ms-2"
							>
								Reset
							</button>
						</div>
					</form>
				</div>
			</div>

			<!-- Error Area -->
			<div id="errorArea" class="mb-3"></div>

			<!-- Table Container -->
			<div class="table-container">
				<div id="tableDisplay" class="text-center text-secondary p-5">
					Enter numbers and click Generate Table to create your table
				</div>
			</div>
		</div>

		<script src="/javascript/script.js"></script>
	</body>
</html>
